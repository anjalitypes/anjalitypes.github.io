<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anjali Patel — Product Designer</title>
  <meta name="description" content="Anjali Patel is a design partner for startups. Ask her portfolio assistant about her work." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Before the page paints: use the visitor's saved light/dark choice (set by
    // the toggle); otherwise dark from sunset to sunrise where they are.
    // Location is estimated from their time zone (no permission prompt).
    (function () {
      let t = null;
      try { t = localStorage.getItem("theme"); } catch {}
      if (t !== "light" && t !== "dark") t = isNight(new Date()) ? "dark" : "light";
      document.documentElement.dataset.theme = t;

      function isNight(now) {
        // Approximate [latitude, longitude] for common time zones
        const ZONES = {
          "America/New_York": [40.7, -74], "America/Chicago": [41.9, -87.6], "America/Denver": [39.7, -105],
          "America/Phoenix": [33.4, -112], "America/Los_Angeles": [34.1, -118.2], "America/Anchorage": [61.2, -149.9],
          "Pacific/Honolulu": [21.3, -157.9], "America/Toronto": [43.7, -79.4], "America/Vancouver": [49.3, -123.1],
          "America/Mexico_City": [19.4, -99.1], "America/Sao_Paulo": [-23.5, -46.6], "America/Argentina/Buenos_Aires": [-34.6, -58.4],
          "Europe/London": [51.5, -0.1], "Europe/Dublin": [53.3, -6.3], "Europe/Paris": [48.9, 2.4], "Europe/Berlin": [52.5, 13.4],
          "Europe/Madrid": [40.4, -3.7], "Europe/Rome": [41.9, 12.5], "Europe/Amsterdam": [52.4, 4.9], "Europe/Stockholm": [59.3, 18.1],
          "Europe/Moscow": [55.8, 37.6], "Europe/Istanbul": [41, 29], "Africa/Cairo": [30, 31.2], "Africa/Lagos": [6.5, 3.4],
          "Africa/Johannesburg": [-26.2, 28], "Africa/Nairobi": [-1.3, 36.8], "Asia/Dubai": [25.2, 55.3], "Asia/Karachi": [24.9, 67],
          "Asia/Kolkata": [22.6, 88.4], "Asia/Calcutta": [22.6, 88.4], "Asia/Dhaka": [23.8, 90.4], "Asia/Bangkok": [13.8, 100.5],
          "Asia/Singapore": [1.35, 103.8], "Asia/Shanghai": [31.2, 121.5], "Asia/Hong_Kong": [22.3, 114.2], "Asia/Manila": [14.6, 121],
          "Asia/Jakarta": [-6.2, 106.8], "Asia/Seoul": [37.6, 127], "Asia/Tokyo": [35.7, 139.7], "Australia/Perth": [-32, 115.9],
          "Australia/Brisbane": [-27.5, 153], "Australia/Sydney": [-33.9, 151.2], "Australia/Melbourne": [-37.8, 145], "Pacific/Auckland": [-36.8, 174.8],
        };
        let zone = "";
        try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch {}
        // Unknown zone: longitude from the standard UTC offset, a mid-northern latitude
        const y = now.getFullYear();
        const stdOffset = Math.max(new Date(y, 0, 1).getTimezoneOffset(), new Date(y, 6, 1).getTimezoneOffset());
        const [lat, lon] = ZONES[zone] || [40, -stdOffset / 4];

        // Sunrise/sunset (NOAA approximation), in minutes after local midnight
        const rad = Math.PI / 180;
        const day = Math.floor((now - new Date(y, 0, 0)) / 864e5);
        const g = (2 * Math.PI / 365) * (day - 1);
        const eqTime = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
        const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
        const cosHa = Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(decl)) - Math.tan(lat * rad) * Math.tan(decl);
        if (cosHa > 1) return true;   // polar night: the sun doesn't rise
        if (cosHa < -1) return false; // midnight sun: it doesn't set
        const ha = Math.acos(cosHa) / rad;
        const local = -now.getTimezoneOffset();
        const sunrise = 720 - 4 * (lon + ha) - eqTime + local;
        const sunset = 720 - 4 * (lon - ha) - eqTime + local;
        const mins = now.getHours() * 60 + now.getMinutes();
        return mins < sunrise || mins >= sunset;
      }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand" id="restart" aria-label="Restart conversation">
      <span class="avatar avatar--sm" id="brand-avatar" aria-hidden="true">AP</span>
      <span class="brand__text">
        <strong>Anjali Patel</strong>
        <span class="status">Product Designer</span>
      </span>
    </a>
    <nav class="topbar__links">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light mode" title="Switch to light mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="#" class="btn btn--ghost btn--sm topbar__contact" data-ask="How can I contact Anjali?">Contact</a>
    </nav>
  </header>

  <main class="chat" id="chat" aria-live="polite">
    <div class="chat__inner" id="thread"></div>
  </main>

  <footer class="composer">
    <div class="composer__inner">
      <div class="suggestions" id="suggestions" role="list"></div>
      <form class="inputbar" id="form" autocomplete="off">
        <input id="input" type="text" placeholder="Type a skill, industry, platform, or tool" aria-label="Filter projects by tag or ask a question" />
        <button type="submit" class="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </div>
  </footer>

  <!-- Case study drawer -->
  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer__scrim" data-close></div>
    <article class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <!-- Sticky case-study header: title (after scrolling), read-aloud, expand, close -->
      <header class="drawer__bar">
        <span class="drawer__bar-title" id="drawer-bar-title" aria-hidden="true"></span>
        <button type="button" class="speak speak--page" id="read-page" data-idle="Listen" aria-label="Listen to case study" hidden>
          <span class="speak__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M14 10a3 3 0 0 1 0 4M16.5 7.5a6.5 6.5 0 0 1 0 9M19 5a10 10 0 0 1 0 14"/></svg>
            <span class="speak__bars"><i></i><i></i><i></i><i></i></span>
          </span><span class="speak__label">Listen</span><span class="speak__more">to case study</span>
        </button>
        <button type="button" class="drawer__btn drawer__expand" id="drawer-expand" aria-pressed="false" aria-label="Expand to full screen" title="Expand">
          <svg class="icon-expand" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
          <svg class="icon-collapse" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10h-6V4M4 14h6v6M14 10l7-7M10 14l-7 7"/></svg>
        </button>
        <button type="button" class="drawer__btn" data-close aria-label="Close" title="Close">✕</button>
      </header>
      <div id="drawer-body"></div>
    </article>
  </div>

  <!-- Resume viewer -->
  <div class="viewer" id="viewer" aria-hidden="true">
    <div class="viewer__scrim" data-close-viewer></div>
    <div class="viewer__panel" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
      <div class="viewer__bar">
        <strong id="viewer-title">Resume</strong>
        <div class="viewer__actions">
          <a class="btn btn--sm btn--accent" id="viewer-download" download>Download</a>
          <a class="btn btn--sm viewer__newtab" id="viewer-newtab" target="_blank" rel="noopener">Open in new tab ↗</a>
          <button type="button" class="drawer__btn" data-close-viewer aria-label="Close">✕</button>
        </div>
      </div>
      <iframe id="viewer-frame" title="Resume PDF"></iframe>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
