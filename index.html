<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anjali Patel — Product Design Leader</title>
  <meta name="description" content="Anjali Patel is a design partner for startups. Ask her portfolio assistant about her work." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand" id="restart" aria-label="Restart conversation">
      <span class="avatar avatar--sm" id="brand-avatar" aria-hidden="true">AP</span>
      <span class="brand__text">
        <strong>Anjali Patel</strong>
        <span class="status">Product Design Leader</span>
      </span>
    </a>
    <nav class="topbar__links">
      <a href="#" data-ask="Show me all projects">Work</a>
      <a href="#" data-ask="Tell me about Anjali Patel">About</a>
    </nav>
  </header>

  <main class="chat" id="chat" aria-live="polite">
    <div class="chat__inner" id="thread"></div>
  </main>

  <footer class="composer">
    <div class="composer__inner">
      <div class="suggestions" id="suggestions" role="list"></div>
      <form class="inputbar" id="form" autocomplete="off">
        <input id="input" type="text" placeholder="Type a skill, industry, platform, or tool" aria-label="Filter projects by tag or ask a question" />
        <button type="submit" class="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <p class="composer__hint" aria-live="polite"></p>
    </div>
  </footer>

  <!-- Case study drawer -->
  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer__scrim" data-close></div>
    <article class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <!-- Sticky case-study header: title (after scrolling), read-aloud, expand, close -->
      <header class="drawer__bar">
        <span class="drawer__bar-title" id="drawer-bar-title" aria-hidden="true"></span>
        <button type="button" class="speak speak--page" id="read-page" data-idle="Listen" aria-label="Listen to case study" hidden>
          <span class="speak__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M14 10a3 3 0 0 1 0 4M16.5 7.5a6.5 6.5 0 0 1 0 9M19 5a10 10 0 0 1 0 14"/></svg>
            <span class="speak__bars"><i></i><i></i><i></i><i></i></span>
          </span><span class="speak__label">Listen</span><span class="speak__more">to case study</span>
        </button>
        <button type="button" class="drawer__btn drawer__expand" id="drawer-expand" aria-pressed="false" aria-label="Expand to full screen" title="Expand">
          <svg class="icon-expand" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
          <svg class="icon-collapse" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10h-6V4M4 14h6v6M14 10l7-7M10 14l-7 7"/></svg>
        </button>
        <button type="button" class="drawer__btn" data-close aria-label="Close" title="Close">✕</button>
      </header>
      <div id="drawer-body"></div>
    </article>
  </div>

  <!-- Resume viewer -->
  <div class="viewer" id="viewer" aria-hidden="true">
    <div class="viewer__scrim" data-close-viewer></div>
    <div class="viewer__panel" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
      <div class="viewer__bar">
        <strong id="viewer-title">Resume</strong>
        <div class="viewer__actions">
          <a class="btn btn--sm btn--accent" id="viewer-download" download>Download</a>
          <a class="btn btn--sm viewer__newtab" id="viewer-newtab" target="_blank" rel="noopener">Open in new tab ↗</a>
          <button type="button" class="drawer__btn" data-close-viewer aria-label="Close">✕</button>
        </div>
      </div>
      <iframe id="viewer-frame" title="Resume PDF"></iframe>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
